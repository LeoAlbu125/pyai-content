overview: |
  **SQLAlchemy** is Python's most widely used SQL toolkit and **Object-Relational Mapper (ORM)**. It gives developers the full power of SQL through a Pythonic query language, while also providing a high-level ORM that maps Python classes to database tables. Whether you want to write raw, finely-tuned SQL or work entirely in Python objects, SQLAlchemy scales from small scripts to large production systems across PostgreSQL, MySQL, SQLite, Oracle, and more.
description: |
  ## 💡 Core Capabilities

  | Capability                | Description                                                                                      |
  |--------------------------|------------------------------------------------------------------------------------------------|
  | **🧩 Core Expression Language** | Build SQL statements programmatically with a composable, database-agnostic query builder.   |
  | **🗺️ Object-Relational Mapper** | Map Python classes to tables and work with rows as regular objects.                          |
  | **🔗 Relationships**         | Define one-to-many, many-to-many, and one-to-one relationships declaratively.                    |
  | **🔄 Connection Pooling**    | Efficient, configurable pooling for high-throughput database access.                              |
  | **🧬 Migrations (via Alembic)** | Companion tool for versioned schema migrations.                                               |
  | **⚡ Async Support**         | `asyncio`-based engine and sessions for async frameworks like FastAPI.                           |

  ---

  ## 🎯 Key Use Cases

  SQLAlchemy is the backbone of database access for a huge share of Python web apps and data tools:

  - **🌐 Web Application Backends**: Model and query application data behind frameworks like Flask and FastAPI.

  - **📊 Data Engineering Pipelines**: Read and write structured data reliably as part of ETL jobs.

  - **🏢 Enterprise Systems**: Manage complex relational schemas with transactions, constraints, and migrations.

  - **🧪 Testing & Prototyping**: Swap in SQLite for fast, isolated tests while using PostgreSQL/MySQL in production.

  ---

  ## 🌟 Why People Use SQLAlchemy

  - **Two Levels of Abstraction**: Use the low-level Core for full SQL control, or the high-level ORM for object-oriented modeling — or mix both.

  - **Database Agnostic**: The same codebase can target PostgreSQL, MySQL, SQLite, Oracle, and MSSQL with minimal changes.

  - **Battle-Tested**: Over a decade of production use across countless companies, with a mature, stable API (2.0+).

  - **Rich Ecosystem**: Deep integration with Alembic (migrations), Flask-SQLAlchemy, FastAPI, and Pydantic-based tools.

  ---

  ## 🔗 Integration with Other Tools

  SQLAlchemy sits at the center of most Python data-access stacks:

  - **🌐 Web Frameworks**: First-class integration with `Flask` (via Flask-SQLAlchemy) and `FastAPI`.

  - **🔄 Migrations**: Pairs with `Alembic` for autogenerated, versioned schema migrations.

  - **🐍 Data Science**: `pandas.read_sql()` and `to_sql()` work directly with SQLAlchemy engines.

  - **✅ Validation**: Often combined with `Pydantic` models to validate data at the API boundary before persisting via the ORM.

  ---

  ## ⚙️ Technical Overview

  SQLAlchemy is organized in two layers that can be used independently or together.

  - **🏗️ Engine**: Manages the database connection and connection pool.
  - **🧱 Core**: A SQL expression language for building and executing statements directly.
  - **🗺️ ORM**: Declarative base classes, mapped models, and a `Session` for tracking and persisting object changes.
  - **🔎 Query Interface**: The modern `select()` construct (SQLAlchemy 2.0 style) for composable, type-friendly queries.

  ---

  ## 🐍 Python Example

  Here's a simple example demonstrating the SQLAlchemy 2.0-style ORM:

  ```python
  from sqlalchemy import create_engine, select
  from sqlalchemy.orm import DeclarativeBase, Mapped, mapped_column, Session

  class Base(DeclarativeBase):
      pass

  class User(Base):
      __tablename__ = "users"
      id: Mapped[int] = mapped_column(primary_key=True)
      name: Mapped[str]
      email: Mapped[str]

  engine = create_engine("sqlite:///example.db")
  Base.metadata.create_all(engine)

  with Session(engine) as session:
      session.add(User(name="Ada Lovelace", email="ada@example.com"))
      session.commit()

      stmt = select(User).where(User.name == "Ada Lovelace")
      user = session.scalars(stmt).first()
      print("Found:", user.name, user.email)
  ```

  ---

  ## 🏆 Alternatives & Comparison

  | Library            | Strengths                                       | Notes                                   |
  |---------------------|-------------------------------------------------|------------------------------------------|
  | **SQLAlchemy**      | Full ORM + Core, mature, database-agnostic        | Steeper learning curve, very flexible     |
  | **Django ORM**      | Tightly integrated with Django, simple to start   | Coupled to the Django framework           |
  | **Peewee**          | Lightweight, minimal ORM                          | Fewer features, smaller ecosystem         |
  | **Tortoise ORM**    | Async-first, Django-like API                      | Newer, smaller community                  |

  > **Note:** SQLAlchemy is free and open-source (MIT license) with no usage limits — cost comes only from the database you connect it to.

  ---

  ## 🐍 Python Ecosystem Relevance

  - **Web Frameworks:** The default ORM choice for `FastAPI` and a popular alternative to Django's built-in ORM.
  - **Migrations:** `Alembic`, built by the same author, is the standard companion for schema versioning.
  - **Data Science:** `pandas` uses SQLAlchemy engines under the hood for SQL I/O.
  - **Validation:** Frequently paired with `Pydantic` to separate API schemas from database models.

  ---

  ## 🔚 Summary

  **SQLAlchemy** is the de facto standard for talking to relational databases in Python. Its dual Core/ORM design lets teams choose between raw SQL control and object-oriented modeling, while broad database support, connection pooling, and a mature migration story (via Alembic) make it a dependable foundation for everything from small scripts to large-scale production systems.
